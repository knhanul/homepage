<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:#f4f8ff;position:relative;color:#0d1b3d}
.b1,.b2{position:absolute;border-radius:50%;filter:blur(70px)}
.b1{width:640px;height:640px;right:-160px;top:-240px;background:radial-gradient(circle,#c8e2ff,transparent 70%)}
.b2{width:520px;height:520px;left:-180px;bottom:-260px;background:radial-gradient(circle,#d2f0ff,transparent 70%)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 96px}
img{width:300px}
h1{font-size:60px;font-weight:800;letter-spacing:-.035em;line-height:1.22;margin:48px 0 0}
.g{background:linear-gradient(135deg,#0069fc,#00a0f0);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:22px 0 0;font-size:26px;color:#5e7090;font-weight:600}
.url{position:absolute;right:96px;bottom:64px;font-size:24px;font-weight:800;color:#0069fc}
</style></head>
<body><div class="b1"></div><div class="b2"></div>
<div class="wrap">
  <img src="../../assets/img/brand/nuni-logo.svg" alt="">
  <h1>일상과 일을 편하게 만드는<br><span class="g">작은 소프트웨어</span></h1>
  <p>데스크톱 · 모바일 · 웹 서비스</p>
</div>
<div class="url">www.nuni.co.kr</div>
</body></html>
